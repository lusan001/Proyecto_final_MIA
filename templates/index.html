<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Ojo del Entrenador - Analista Táctico</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            background: linear-gradient(135deg, #0f2e19 0%, #051408 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #b8860b;
            color: #ffd700;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* --- CONTENEDOR DEL CAMPO (VISUAL) --- */
        .pitch-container {
            width: 100%;
            max-width: 800px;
            height: 350px;
            background-color: #1a5e2a;
            background-image: 
                linear-gradient(90deg, transparent 49%, rgba(255,255,255,0.1) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(255,255,255,0.1) 50%, transparent 51%),
                repeating-linear-gradient(90deg, transparent 0, transparent 50px, rgba(255,255,255,0.05) 50px, rgba(255,255,255,0.05) 100px);
            border: 4px solid #ffffff;
            border-radius: 12px;
            margin: 20px auto;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Círculo central y líneas */
        .pitch-circle {
            width: 140px;
            height: 140px;
            border: 3px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            position: absolute;
        }
        .pitch-line {
            position: absolute;
            background: rgba(255,255,255,0.6);
        }
        .line-center { width: 3px; height: 100%; left: 50%; }
        .line-top { height: 3px; width: 100%; top: 15%; }
        .line-bottom { height: 3px; width: 100%; bottom: 15%; }

        /* --- ÁREA DE ENTRADA --- */
        .input-area {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 90%;
            height: 80px;
            border-radius: 8px;
            border: 2px solid #4a8c5a;
            padding: 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a1a;
            resize: vertical;
            font-family: inherit;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        textarea:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        button {
            background: linear-gradient(45deg, #d32f2f, #b71c1c);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(211, 47, 47, 0.5);
            transition: all 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #f44336, #d32f2f);
            box-shadow: 0 8px 25px rgba(244, 67, 54, 0.6);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- RESULTADOS --- */
        #resultsArea {
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
        }

        .loading {
            font-size: 1.2rem;
            color: #ffd700;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .diagnosis-card {
            background: rgba(20, 20, 20, 0.9);
            border-left: 6px solid #ffd700;
            margin: 15px 0;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            animation: slideIn 0.6s ease-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Colores de severidad */
        .severity-URGENTE { border-left-color: #ff3333; }
        .severity-CRITICA { border-left-color: #ff9900; }
        .severity-ALTA { border-left-color: #ffcc00; }
        .severity-MEDIA { border-left-color: #00ccff; }
        .severity-LEVE { border-left-color: #00ff00; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .diag-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #000;
        }
        .bg-URGENTE { background: #ff3333; color: white; }
        .bg-CRITICA { background: #ff9900; color: black; }
        .bg-ALTA { background: #ffcc00; color: black; }
        .bg-MEDIA { background: #00ccff; color: black; }
        .bg-LEVE { background: #00ff00; color: black; }
        .bg-TACTICA { background: #9c27b0; color: white; }
        .bg-MEDICA { background: #e91e63; color: white; }

        .card-body {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e0e0e0;
        }
        .card-body strong {
            color: #ffd700;
        }

        .sintomas-detected {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .sintoma-tag {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 15px;
            margin: 4px;
            font-weight: bold;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

    </style>
</head>
<body>

    <h1>👁️ OJO DEL ENTRENADOR</h1>
    <p class="subtitle">Sistema Experto de Análisis Táctico y Médico</p>

    <!-- Visual del Campo de Fútbol -->
    <div class="pitch-container">
        <div class="pitch-line line-center"></div>
        <div class="pitch-line line-top"></div>
        <div class="pitch-line line-bottom"></div>
        <div class="pitch-circle"></div>
        <div style="position: absolute; color: rgba(255,255,255,0.2); font-size: 40px; font-weight: bold;">ESTADIO VIRTUAL</div>
    </div>

    <!-- Entrada de Datos -->
    <div class="input-area">
        <textarea id="inputSituation" placeholder="Describe la situación del partido... Ejemplo: 'El lateral izquierdo está muy arriba, el rival contraataca rápido por ahí y el 10 está muy cansado y cojea un poco'"></textarea>
        <br>
        <button id="btnAnalyz" onclick="analizar()">📊 ANALIZAR PARTIDO</button>
    </div>

    <!-- Área de Resultados -->
    <div id="resultsArea"></div>

    <script>
        async function analizar() {
            const texto = document.getElementById('inputSituation').value;
            const btn = document.getElementById('btnAnalyz');
            const resultsArea = document.getElementById('resultsArea');

            if (!texto.trim()) {
                alert("Por favor, describe una situación del partido.");
                return;
            }

            // UI: Estado de carga
            btn.disabled = true;
            btn.innerText = "ANALIZANDO...";
            resultsArea.innerHTML = '<div class="loading">🧠 Procesando datos tácticos y médicos con IA...</div>';

            try {
                // Llamada al Backend Flask
                const response = await fetch('/analizar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({texto: texto})
                });

                if (!response.ok) {
                    throw new Error("Error de conexión con el servidor");
                }

                const data = await response.json();

                // Limpiar carga
                resultsArea.innerHTML = '';

                // 1. Mostrar síntomas detectados
                if (data.sintomas && data.sintomas.length > 0) {
                    const sintomasHTML = data.sintomas
                        .filter(s => s !== 'desconocido')
                        .map(s => `<span class="sintoma-tag">${s.replace('_', ' ').toUpperCase()} (${Math.round(s*100)}%)</span>`)
                        .join('');
                    
                    const sintomasDiv = document.createElement('div');
                    sintomasDiv.className = 'sintomas-detected';
                    sintomasDiv.innerHTML = `<strong>🔍 Síntomas Detectados:</strong> ${sintomasHTML || 'Ninguno claro'}`;
                    resultsArea.appendChild(sintomasDiv);
                }

                // 2. Mostrar Diagnósticos
                if (data.diagnosticos && data.diagnosticos.length > 0) {
                    data.diagnosticos.forEach(d => {
                        const card = document.createElement('div');
                        // Asignar clase de severidad y tipo
                        const severityClass = `severity-${d.severidad}`;
                        const typeClass = `bg-${d.tipo}`;
                        
                        card.className = `diagnosis-card ${severityClass}`;
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="diag-title">🚨 ${d.diagnostico}</span>
                                <span class="badge ${typeClass}">${d.tipo}</span>
                                <span class="badge bg-${d.severidad}">${d.severidad}</span>
                            </div>
                            <div class="card-body">
                                <strong>Acción Recomendada:</strong><br>
                                ${d.accion}
                            </div>
                        `;
                        resultsArea.appendChild(card);
                    });
                } else {
                    const info = document.createElement('div');
                    info.style.textAlign = 'center';
                    info.style.color = '#aaa';
                    info.style.marginTop = '20px';
                    info.innerHTML = "No se encontraron reglas exactas para esta combinación de síntomas.";
                    resultsArea.appendChild(info);
                }

            } catch (error) {
                console.error(error);
                resultsArea.innerHTML = `<div style="color: #ff3333; text-align: center; padding: 20px;">❌ Error: ${error.message}. Asegúrate de que el servidor Flask esté corriendo.</div>`;
            } finally {
                // Restaurar botón
                btn.disabled = false;
                btn.innerText = "📊 ANALIZAR PARTIDO";
            }
        }
    </script>
</body>
</html>
